<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agência Virtual | ELEKTRO</title>
    <meta name="description" content="Acesse sua conta e resolva tudo online.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #2d8a2d;
            color: #1a2e1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: #1a5a1a;
            padding: 12px 20px;
        }
        
        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-weight: 700;
            font-size: 18px;
        }
        
        .logo-dots {
            display: flex;
            gap: 2px;
        }
        
        .logo-dot {
            width: 6px;
            height: 20px;
            background: white;
            border-radius: 3px;
        }
        
        .btn-login {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            background: transparent;
            color: white;
            font-weight: 500;
            font-size: 14px;
            border: none;
            cursor: pointer;
            text-decoration: none;
        }

        /* Hero */
        .hero {
            padding: 24px 20px;
            text-align: center;
        }
        
        .hero h1 {
            font-size: 20px;
            font-weight: 700;
            color: white;
        }
        
        .hero p {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            margin-top: 4px;
        }

        /* Services */
        .services {
            flex: 1;
            background: white;
            border-radius: 24px 24px 0 0;
            padding: 20px;
        }
        
        .services h2 {
            font-size: 16px;
            font-weight: 700;
            color: #2d8a2d;
            margin-bottom: 16px;
        }
        
        .services-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .service-card {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: transform 0.2s;
        }
        
        .service-card:active {
            transform: scale(0.98);
        }
        
        .service-card.highlight {
            background: #f5a623;
            border: none;
        }
        
        .service-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .service-card:not(.highlight) .service-icon {
            background: rgba(45,138,45,0.1);
        }
        
        .service-card.highlight .service-icon {
            background: rgba(0,0,0,0.1);
        }
        
        .service-icon svg {
            width: 20px;
            height: 20px;
        }
        
        .service-card:not(.highlight) .service-icon svg {
            stroke: #2d8a2d;
        }
        
        .service-info {
            flex: 1;
            min-width: 0;
        }
        
        .service-title {
            font-weight: 600;
            font-size: 14px;
        }
        
        .service-badge {
            display: inline-block;
            background: rgba(0,0,0,0.15);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            margin-top: 4px;
        }
        
        .service-desc {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }
        
        .service-card.highlight .service-desc {
            color: rgba(0,0,0,0.7);
        }
        
        .service-arrow {
            color: #ccc;
            flex-shrink: 0;
        }
        
        .service-card.highlight .service-arrow {
            color: rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <!-- ========== TROQUE O LINK: https://elektroenergia.online/ ========== -->
    
    <header class="header">
        <div class="header-content">
            <div class="logo">

                    <div class="logo-dot"></div>
                    <div class="logo-dot"></div>
                    <div class="logo-dot"></div>
                </div>
                <span>ELEKTRO</span>
            </div>
            <a href="https://elektroenergia.online/" class="btn-login">
                Login
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                </svg>
            </a>
        </div>
    </header>
    
    <section class="hero">

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/>

                <div class="service-info">

                </div>
                <svg class="service-arrow" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                </svg>
            </a>
            
            <a href="https://elektroenergia.online/" class="service-card">
                <div class="service-icon">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                </div>
                <div class="service-info">
                    <div class="service-title">2ª Via de Pagamento</div>
                    <p class="service-desc">Solicite sua fatura</p>
                </div>
                <svg class="service-arrow" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                </svg>
            </a>
            
            <a href="https://elektroenergia.online/" class="service-card">
                <div class="service-icon">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                    </svg>
                </div>
                <div class="service-info">
                    <div class="service-title">Troca de Titularidade</div>
                    <p class="service-desc">Altere o titular da conta</p>
                </div>
                <svg class="service-arrow" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                </svg>
            </a>
        </div>
    </section>

</body>
</html>
